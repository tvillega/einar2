[Docker]
image = internetsystemsconsortium/bind9:latest
command = -g

[Ports]
PortArray[] = 53:53/udp
PortArray[] = 53:53/tcp
PortArray[] = 953:953/tcp

[Volumes]
VolArray[] = ./bind9/config:/etc/bind
VolArray[] = ./bind9/cache:/var/cache/bind
VolArray[] = ./bind9/zones:/var/lib/bind

[Capabilities]
CapArray = NET_BIND_SERVICE
