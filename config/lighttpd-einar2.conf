server.modules = (
    "mod_access",
    "mod_fastcgi",
    "mod_accesslog",
    "mod_dirlisting",
    "mod_alias"
)

server.username = "lighttpd"
server.groupname = "lighttpd"

server.document-root = "/einar2/www"
index-file.names = ( "index.php" )
dir-listing.activate = "enable"

fastcgi.server = ( ".php" =>
    ((
        "bin-path" => "/usr/bin/php-cgi",
        "socket" => "/tmp/php-fastcgi.socket",
        "max-procs" => 1,
        "bin-environment" => (
            "PHP_FCGI_CHILDREN" => "4",
            "PHP_FCGI_MAX_REQUESTS" => "10000"
        )
    ))
)

alias.url = (
    "/archetypes/" => "/einar2/archetypes/",
    "/labs/" => "/einar2/labs/",
    "/libexec/" => "/einar2/libexec/"
)
