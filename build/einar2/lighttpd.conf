server.modules = (
    "mod_access",
    "mod_fastcgi",
    "mod_accesslog",
    "mod_dirlisting",
    "mod_alias"
)

server.username = "lighttpd"
server.groupname = "lighttpd"

server.document-root = "/www"
index-file.names = ( "index.php" )
dir-listing.activate = "enable"

fastcgi.server = ( ".php" =>
    ((
        "bin-path" => "/usr/bin/php-cgi",
        "socket" => "/tmp/php-fastcgi.socket",
        "max-procs" => 1,
        "bin-environment" => (
            "PHP_FCGI_CHILDREN" => "4",
            "PHP_FCGI_MAX_REQUESTS" => "10000"
        )
    ))
)

alias.url = (
    "/fs/archetypes/" => "/archetypes/",
    "/fs/compose/" => "/compose/",
    "/fs/labs/" => "/labs/",
    "/fs/libexec/" => "/libexec/",
    "/fs/utils/" => "/utils/",
    "/fs/einar2/" => "/einar2/"
)
