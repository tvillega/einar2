
  computer-{{ Name }}:
    image: {{ Image }}
    entrypoint: /einar2/entrypoints/computer.sh
    stdin_open: true
    tty: true
    cap_add:
      - NET_ADMIN
    environment:
      - DEFAULT_GATEWAY={{ DefaultGateway }}
    sysctls:
      - net.ipv4.conf.all.rp_filter=0 {# if per interface: net.ipv4.conf.ethX.rp_filter=0 #}
      - net.ipv4.conf.default.rp_filter=0
    hostname: computer-{{ Name }}
    networks:
