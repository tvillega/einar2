
  router-{{ Name }}:
    image: {{ Image }}
    entrypoint: /einar2/entrypoints/router.sh
    stdin_open: true
    tty: true
    cap_add:
      - NET_ADMIN
    environment:
      - DEFAULT_GATEWAY={{ DefaultGateway }}
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.rp_filter=0 {# if per interface: net.ipv4.conf.ethX.rp_filter=0 #}
      - net.ipv4.conf.default.rp_filter=0
      {# - net.ipv4.conf.eth0.rp_filter=0 #}
    hostname: router-{{ Name }}
    volumes:
      - ./e2-router-{{ Name }}-quagga:/etc/quagga
    networks:
