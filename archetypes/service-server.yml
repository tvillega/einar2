
  e2-server-{{ .AddressDashed }}:
    image: e2-server:latest
    container_name: e2-server-{{ .AddressDashed }}
    stdin_open: true
    tty: true
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.rp_filter=0 {# if per interface: net.ipv4.conf.ethX.rp_filter=0 #}
      - net.ipv4.conf.default.rp_filter=0
    hostname: server-{{ .AddressDashed }}
    ports:
      - "{{ .Port }}:80"
    networks:
      switch-{{ .NetworkDashed }}:
        ipv4_address: {{ .Address }}
