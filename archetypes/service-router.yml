
  e2-router-{{ .AddressDashed }}:
    image: e2-router:latest
    container_name: e2-router-{{ .AddressDashed }}
    stdin_open: true
    tty: true
    privileged: true {# Allows the container to modify the host #}
    hostname: router-{{ .AddressDashed }}
    volumes:
      - ./quagga:/etc/quagga
    networks:
      net-{{ .NetworkDashed }}:
        ipv4_address: {{ .Address }}
