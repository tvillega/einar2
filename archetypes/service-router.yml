
  e2-router-{{ Name }}:
    image: {{ Image }}
    container_name: e2-router-{{ Name }}
    entrypoint: /router/entrypoint.sh
    stdin_open: true
    tty: true
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.rp_filter=0 {# if per interface: net.ipv4.conf.ethX.rp_filter=0 #}
      - net.ipv4.conf.default.rp_filter=0
      {# - net.ipv4.conf.eth0.rp_filter=0 #}
    hostname: router-{{ Name }}
    volumes:
      - ./e2-router-{{ Name }}-quagga:/etc/quagga
    networks:
