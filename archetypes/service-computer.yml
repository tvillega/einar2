
  e2-computer-{{ .AddressDashed }}:
    image: e2-computer:latest
    container_name: e2-computer-{{ .AddressDashed }}
    stdin_open: true
    tty: true
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.rp_filter=0 {# if per interface: net.ipv4.conf.ethX.rp_filter=0 #}
      - net.ipv4.conf.default.rp_filter=0
    hostname: computer-{{ .AddressDashed }}
    networks:
      switch-{{ .NetworkDashed }}:
        ipv4_address: {{ .Address }}
