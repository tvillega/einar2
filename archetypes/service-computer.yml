
  e2-computer-{{ .AddressDashed }}:
    image: e2-computer:latest
    container_name: e2-computer-{{ .AddressDashed }}
    stdin_open: true
    tty: true
    privileged: true {# Allows the container to modify the host #}
    hostname: computer-{{ .AddressDashed }}
    networks:
      net-{{ .NetworkDashed }}:
        ipv4_address: {{ .Address }}
