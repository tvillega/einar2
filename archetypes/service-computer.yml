
  e2-computer-{{ Name }}:
    image: {{ Image }}
    container_name: e2-computer-{{ Name }}
    entrypoint: /computer/entrypoint.sh
    stdin_open: true
    tty: true
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.rp_filter=0 {# if per interface: net.ipv4.conf.ethX.rp_filter=0 #}
      - net.ipv4.conf.default.rp_filter=0
    hostname: computer-{{ Name }}
    networks:
